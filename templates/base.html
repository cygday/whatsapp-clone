<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WhatsApp Clone{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#202b30; --muted:#68777b; --line:#dce4df; --paper:#f5f7f2; --white:#fff; --green:#176b56; --lime:#d8efb2; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.5 "Trebuchet MS", "Segoe UI", sans-serif; }
    a { color:var(--green); text-decoration:none; } a:hover { text-decoration:underline; }
    header { height:62px; display:flex; align-items:center; justify-content:space-between; padding:0 max(22px,calc((100% - 1120px)/2)); color:white; background:#174b40; }
    .brand { color:white; font-size:20px; font-weight:700; letter-spacing:.3px; }
    nav { display:flex; align-items:center; gap:18px; } nav a { color:white; }
    main { width:min(1120px,100%); margin:30px auto; padding:0 20px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:26px; margin-bottom:4px; } h2 { font-size:18px; }
    .muted, small { color:var(--muted); } .layout { display:grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 1.5fr); gap:22px; }
    .panel { background:var(--white); border:1px solid var(--line); border-radius:7px; padding:20px; }
    .stack { display:grid; gap:12px; } .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .person { border-top:1px solid var(--line); padding:12px 0; } .person:first-child { border-top:0; }
    input,textarea,select { width:100%; border:1px solid #bdcbc4; border-radius:5px; padding:10px 11px; font:inherit; background:white; color:var(--ink); }
    textarea { min-height:76px; resize:vertical; } label { font-weight:600; font-size:14px; }
    button,.button { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:5px; padding:10px 14px; background:var(--green); color:white; font:inherit; font-weight:700; cursor:pointer; }
    .button.secondary,button.secondary { background:#e8efeb; color:var(--ink); } form { display:grid; gap:10px; }
    .messages { display:grid; gap:8px; margin-bottom:16px; } .notice { padding:10px 12px; border-radius:5px; background:#e6f3db; }
    .bubble { max-width:78%; padding:10px 13px; border-radius:8px; background:#edf2ef; overflow-wrap:anywhere; }
    .bubble.mine { margin-left:auto; background:var(--lime); } .conversation { height:min(58vh,540px); overflow:auto; display:flex; flex-direction:column; gap:10px; padding:4px 0 16px; }
    .errorlist { margin:0; padding-left:20px; color:#a32b32; } footer { margin-top:18px; }
    @media (max-width:700px) { header { padding:0 16px; } nav { gap:10px; font-size:13px; } main { margin:18px auto; padding:0 12px; } .layout { grid-template-columns:1fr; } .panel { padding:16px; } }
  </style>
</head>
<body>
  <header><a class="brand" href="{% url 'chat:inbox' %}">WhatsApp Clone</a>
    <nav>{% if request.user.is_authenticated %}<a href="{% url 'chat:inbox' %}">Chats</a><a href="{% url 'profile' %}">Profile</a><form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button class="secondary" type="submit">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a><a href="{% url 'register' %}">Create account</a>{% endif %}</nav>
  </header>
  <main>
    {% if messages %}<div class="messages">{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
