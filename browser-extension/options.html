<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Clone Link Redirect Settings</title>
  <style>
    body { max-width: 560px; margin: 48px auto; padding: 0 20px; color: #202b30; font: 15px/1.5 sans-serif; }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #bdcbc4; border-radius: 5px; font: inherit; }
    button { margin-top: 14px; padding: 10px 14px; border: 0; border-radius: 5px; background: #176b56; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Link redirect settings</h1>
  <form id="settings-form">
    <label for="app-url">WhatsApp Clone app URL</label>
    <input id="app-url" type="url" placeholder="https://whatsapp-clone-q1ad.onrender.com" required>
    <button type="submit">Save settings</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <script src="options.js"></script>
</body>
</html>
